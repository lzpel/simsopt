name: Wheel Builder

# TEST-ONLY: trimmed to a single Windows/cp312 build to check the boost
# bootstrap invocation quickly. Do not merge this file.

on: [push]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_BUILD: cp312-*
          CIBW_SKIP: cp38-* cp39-* pp* *-manylinux_i686 *-musllinux* *-win32
          # numpy >= 2.3 ships only manylinux_2_28 wheels and its sdist needs
          # GCC >= 10.3, which the default manylinux2014 image lacks.
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
          CIBW_ENVIRONMENT: CI=1
          #   CIBW_DEPENDENCY_VERSIONS: latest

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl
