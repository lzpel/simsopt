# This file is based on examples in
# https://docs.github.com/en/actions/language-and-framework-guides/using-python-with-github-actions

# Note that all the "sudo" commands here appear to cause a warning message
# "sudo: setrlimit(RLIMIT_CORE): operation not permitted"
# This appears to be a known harmless annoyance:
# https://gitlab.alpinelinux.org/alpine/aports/-/issues/11122

name: Tests

on: 
  push:
    branches-ignore: [master]
    tags-ignore: [v*]
  pull_request:
    branches-ignore: [master]

concurrency:
  # Use github.run_id on main branch
  # Use github.event.pull_request.number on pull requests, so it's unique per pull request
  # Use github.ref on other branches, so it's unique per branch
  group: ${{ github.workflow }}-${{ github.ref == github.ref_protected && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: sh

    env:
      OMPI_ALLOW_RUN_AS_ROOT: 1
      OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: 1
      # The windows console defaults to a legacy code page (cp1252), which
      # cannot print the unicode characters some optimizers log.
      PYTHONUTF8: 1

    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-24.04", "windows-2025"]
        python-version: ["3.11"]
        test-type: [unit, integrated]
        variant: [default]
        exclude:
          # The integrated tests run the example scripts, which need MPI and
          # VMEC; neither is available on windows.
          - os: windows-2025
            test-type: integrated
        include:
          # A second windows job that uses the native (MSVC-built) Python
          # from setup-python instead of Cygwin's, so simsopt is built the
          # same way as the released wheels and jaxlib/scipy come as wheels.
          - os: windows-2025
            python-version: "3.11"
            test-type: unit
            variant: native-python

    steps:
    # First print out lots of information. We do this in separate 
    # "name" blocks because otherwise the output gets mixed together
    # in the github actions log.
    
    - name: Print user and group id
      run: |
        set -ex
        id

    - name: PWD
      run: |
        set -ex
        pwd

    - name: ls -l
      run: |
        set -ex
        ls -l

    - name: Print python location
      run: |
        set -ex
        which python || echo "python is not on the PATH yet"

    - name: apt-get stuff needed for libstell and vmec
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gfortran openmpi-bin libopenmpi-dev libnetcdf-dev libnetcdff-dev liblapack-dev libscalapack-mpi-dev libhdf5-dev libhdf5-serial-dev git m4 libfftw3-dev libboost-all-dev libopenblas-dev

    # Keep LF line endings on windows, otherwise the sh scripts in the repo
    # break on the \r characters.
    - name: Force LF line endings on checkout
      if: runner.os == 'Windows'
      run: git config --global core.autocrlf input

    - uses: actions/checkout@v4

    - name: Fetch all history for all tags
      run: git fetch --all --tags --prune --unshallow

    # The runner writes the run-step scripts with CRLF line endings on
    # windows. Git's sh strips the \r but Cygwin's sh does not, so tell
    # Cygwin's sh (bash) to ignore carriage returns. This step still runs
    # under Git's sh because Cygwin is not on the PATH yet.
    - name: Make Cygwin sh ignore carriage returns
      if: runner.os == 'Windows'
      run: echo "SHELLOPTS=igncr" >> $GITHUB_ENV

    # Cygwin plays the role apt-get does on the ubuntu runners: it provides
    # the unix toolchain, libraries and the python interpreter.
    - name: Set up Cygwin
      if: runner.os == 'Windows' && matrix.variant == 'default'
      uses: cygwin/cygwin-install-action@v6
      with:
        packages: >-
          python39 python39-devel python39-pip
          python39-numpy python39-matplotlib python39-h5py
          gcc-core gcc-g++ gcc-fortran make cmake ninja ccache git m4
          pkg-config libboost-devel liblapack-devel libopenblas
          libhdf5-devel libfftw3-devel libnetcdf-devel

    - name: Make python and pip resolve to the Cygwin interpreter
      if: runner.os == 'Windows' && matrix.variant == 'default'
      run: |
        ln -sf /usr/bin/python3.9 /usr/bin/python
        ln -sf /usr/bin/python3.9 /usr/bin/python3
        ln -sf /usr/bin/pip3.9 /usr/bin/pip
        python --version
        pip --version
        # Cygwin's git has its own HOME and global config, and the Windows
        # ACL of the checkout looks like a foreign owner to it. Without this
        # the 'git submodule update' that CMakeLists.txt runs fails with
        # 'detected dubious ownership'.
        git config --global --add safe.directory '*'

    # We must run actions/checkout before downloading and building VMEC, since checkout deletes the contents of the directory.
    - name: Download the VMEC2000 standalone repository
      if: runner.os == 'Linux'
      run: git clone --depth=1 https://github.com/hiddensymmetries/VMEC2000.git

    - name: ls -l again
      run: |
        set -ex
        ls -l
        pwd

    # On windows the python interpreter comes from Cygwin instead, except
    # in the native-python variant.
    - name: Set up Python ${{ matrix.python-version }}
      if: runner.os == 'Linux' || matrix.variant == 'native-python'
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: which python3 after python setup
      run: which python3 || which python

    - name: which pip after python setup
      run: |
        python -m pip install --upgrade pip
        pip --version

    - name: env after adding python
      run: env

    # cmake and ninja are left out here: on windows they come from Cygwin,
    # and pip would otherwise build them from source since PyPI has no
    # Cygwin wheels.
    - name: Install python dependencies
      run: pip install numpy f90nml wheel setuptools sympy qsc pyevtk matplotlib plotly networkx h5py ground==9 bentley_ottmann==8 Deprecated monty ruamel.yaml

    # These need graphviz, MPI and a fortran compiler, which are only set up
    # on the ubuntu runners.
    - name: Install linux-only python dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get install graphviz graphviz-dev
        pip install cmake scikit-build ninja pygraphviz mpi4py f90wrap

    # - name: Install pyoculus
    #   run: pip install -v git+https://github.com/zhisong/pyoculus

    - name: Install booz_xform
      if: runner.os == 'Linux'
      run: pip install -v git+https://github.com/hiddenSymmetries/booz_xform

    - name: Install virtual_casing
      if: runner.os == 'Linux'
      run: pip install -v git+https://github.com/hiddenSymmetries/virtual-casing

    - name: Install desc-opt
      if: runner.os == 'Linux'
      run: pip install desc-opt

    # 2025-11-28: Temporarily disabling SPEC due to github issue #561
    # # See https://github.community/t/best-way-to-clone-a-private-repo-during-script-run-of-private-github-action/16116/7
    # # https://stackoverflow.com/questions/57612428/cloning-private-github-repository-within-organisation-in-actions
    # # https://docs.github.com/en/free-pro-team@latest/github/authenticating-to-github/creating-a-personal-access-token
    # - name: Check out SPEC
    #   uses: actions/checkout@v4
    #   with:
    #     repository: PrincetonUniversity/SPEC
    #     path: SPEC
     
    # - name: ls -l again
    #   run: |
    #     ls -l
    #     pwd

    # - name: ls -l inside SPEC
    #   run: |
    #     cd SPEC
    #     pwd
    #     ls -l

    # # For some reason, installing py_spec does not install the dependencies f90nml and h5py. Therefore I installed these manually above.
    # - name: Install py_spec
    #   run: |
    #     pip install -r SPEC/Utilities/pythontools/requirements.txt
    #     pip install -e SPEC/Utilities/pythontools
    #     python -c "import py_spec; print('success')"

    # - name: Build SPEC python wrapper.
    #   run: |
    #     cd SPEC
    #     pip install .

    # - name: Try import spec
    #   run: python -c "import spec.spec_f90wrapped as spec; print(spec.constants.version)"

    - name: ls in /usr/lib/x86_64-linux-gnu
      if: runner.os == 'Linux'
      run: ls -l /usr/lib/x86_64-linux-gnu

    - name: Add to LD_LIBRARY_PATH so scalapack etc can be found
      if: runner.os == 'Linux'
      run: echo "LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu" >> $GITHUB_ENV

    - name: env after adding to LD_LIBRARY_PATH
      run: env

    - name: ls in VMEC2000/python 1
      if: runner.os == 'Linux'
      run: ls -l VMEC2000/python

    - name: Configure and install VMEC2000 module
      if: runner.os == 'Linux'
      run: |
        cd VMEC2000
        cp cmake/machines/ubuntu.json cmake_config_file.json
        cat cmake_config_file.json
        pip install .

    - name: Try importing vmec module
      if: runner.os == 'Linux'
      run: python -c "print(dir()); import vmec; print(dir()); print(dir(vmec)); print('package:', vmec.__package__); print('spec:', vmec.__spec__); print('doc:', vmec.__doc__); print('file:', vmec.__file__); print('path:', vmec.__path__)"

    - name: Install simsopt package
      # run: env CMAKE_BUILD_TYPE=Debug pip install -v .[MPI,SPEC]
      # run: pip install -v ".[MPI,SPEC,VIS]"
      if: runner.os == 'Linux'
      run: pip install -v ".[MPI,VIS]"

    # --no-deps because jaxlib has no Cygwin distribution at all; the other
    # runtime dependencies are installed above. The jax-dependent tests
    # (geo, field, ...) fail at import and show up in the test step.
    # --no-build-isolation because in the isolated env CMake's FindPython
    # cannot locate the python library and numpy headers (and numpy gets
    # rebuilt from source every run), so the build requirements go into the
    # system environment and the locations are handed to CMake explicitly.
    - name: Install simsopt package (windows, Cygwin)
      if: runner.os == 'Windows' && matrix.variant == 'default'
      run: |
        pip install scikit-build-core "pybind11<3.0.0" setuptools_scm tomli
        ls -l /usr/lib/libpython* || echo "no libpython found"
        if ! python -c "import numpy"; then
          echo "=== numpy import failed, dumping diagnostics ==="
          ls -l /usr/lib/python3.9/site-packages/numpy/linalg/
          cygcheck /usr/lib/python3.9/site-packages/numpy/linalg/_umath_linalg*.dll || true
          ls -l /usr/bin/cygblas* /usr/bin/cyglapack* /usr/lib/lapack /etc/alternatives 2>&1 | head -50
          exit 1
        fi
        CMAKE_ARGS="-DPython_EXECUTABLE=/usr/bin/python3.9 -DPython_INCLUDE_DIR=/usr/include/python3.9 -DPython_NumPy_INCLUDE_DIR=$(python -c 'import numpy; print(numpy.get_include())')"
        if ls /usr/lib/libpython3.9*.dll.a >/dev/null 2>&1; then
          CMAKE_ARGS="$CMAKE_ARGS -DPython_LIBRARY=$(ls /usr/lib/libpython3.9*.dll.a | head -n 1)"
        fi
        export CMAKE_ARGS
        echo "CMAKE_ARGS=$CMAKE_ARGS"
        pip install -v --no-deps --no-build-isolation .

    # With the native python all dependencies including jaxlib are available
    # as wheels; only the MPI and VIS extras stay off (no mpi4py/vtk).
    - name: Install simsopt package (windows, native python)
      if: runner.os == 'Windows' && matrix.variant == 'native-python'
      run: pip install -v .

    - name: Verify that importing simsopt does not automatically initialize MPI
      if: runner.os == 'Linux'
      run: ./tests/verify_MPI_not_initialized.py

    - name: Run examples as part of integrated tests
      if: contains(matrix.test-type, 'integrated')
      run: |
        cd examples
        ./run_serial_examples
        ./run_parallel_examples
        ./run_vmec_examples
        # ./run_spec_examples
        # ./run_spec_vmec_examples

    - name: Install coverage dependencies
      if: contains(matrix.test-type, 'unit')
      run: pip install coverage

    # Run every directory even if an earlier one fails, so a single run
    # reports all failing directories, then fail the step at the end.
    - name: Run tests on 1 process using coverage
      if: contains(matrix.test-type, 'unit')
      run: |
        rc=0
        for dir in configs core field geo mhd objectives solve util; do
          coverage run --source=simsopt -m unittest discover -t tests -v -s tests/$dir || rc=1
        done
        exit $rc

    - name: Run MPI tests using coverage
      if: contains(matrix.test-type, 'unit') && runner.os == 'Linux'
      run: |
        mpiexec -n 1 coverage run -m unittest discover -k "mpi" -s tests -v
        mpiexec -n 2 coverage run -m unittest discover -k "mpi" -s tests -v
        mpiexec -n 3 --oversubscribe coverage run -m unittest discover -k "mpi" -s tests -v

    - name: ls to see coverage files that were produced
      if: contains(matrix.test-type, 'unit')
      run: ls -al

    - name: Combine coverage reports
      if: contains(matrix.test-type, 'unit')
      run: | 
        coverage combine
        coverage report
        coverage xml

    - name: Upload coverage to github
      if: contains(matrix.test-type, 'unit') && runner.os == 'Linux'
      uses: actions/upload-artifact@v4
      with:
        name: tox-gh-actions-coverage
        path: coverage.xml
        if-no-files-found: error

    - name: Upload coverage to Codecov
      # The last conditional on the next line prevents github from trying to upload to Codecov on forks of the repository, avoiding a permissions error
      if: contains(matrix.test-type, 'unit') && runner.os == 'Linux' && github.repository_owner == 'hiddenSymmetries'
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: ./coverage.xml
        #files: ./coverage1.xml,./coverage2.xml
        #directory: ./coverage/reports/
        flags: unittests
        env_vars: PYTHON
        name: codecov-umbrella
        fail_ci_if_error: true
        #path_to_write_report: ./coverage/codecov_report.gz
        verbose: true
